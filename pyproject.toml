[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finding-the-right-balance"
version = "0.1.0"
description = "Evaluation code for relevance-diversity trade-offs in RAG"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "datasets>=2.18.0",
  "faiss-cpu>=1.7.4",
  "matplotlib>=3.7.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0.0",
  "scipy>=1.11.0",
  "sentence-transformers>=2.6.0",
  "sentencepiece>=0.1.99",
  "tabulate>=0.9.0",
  "threadpoolctl>=3.1.0",
  "torch>=2.0.0",
  "tqdm>=4.66.0",
  "transformers>=4.38.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ftrb-analyze = "analysis.analyze_regimes:main"
ftrb-benchmark-cpu = "benchmarks.benchmark_cpu_latency:main"
ftrb-plot-geometry = "analysis.plot_geometry:main"
ftrb-plot-regimes = "analysis.plot_regimes:main"
ftrb-beir = "experiments.evaluate_beir:main"
ftrb-cross-encoder = "experiments.evaluate_cross_encoder:main"
ftrb-efficiency = "experiments.efficiency:main"
ftrb-evaluate = "experiments.evaluate:main"
ftrb-redundancy = "experiments.evaluate_redundancy:main"
ftrb-retrieve = "experiments.retrieve_passages:main"
ftrb-tune = "experiments.learn_alpha:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "benchmarks*", "data*", "evaluation*", "experiments*", "ftrb*", "generation*", "retrieval*"]
namespaces = false
